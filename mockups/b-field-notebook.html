<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ghost Rovers: Field Notebook</title>


<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&amp;family=Atkinson+Hyperlegible:wght@400;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#2B4C7E}a:hover{color:#1C3559}
</style>
<style>body{background:#111;display:flex;justify-content:center;padding:24px 0}</style>
</head>
<body>


<div style="width: 1280px; height: 800px; position: relative; overflow: hidden; background-color: #F4EEDF; background-image: repeating-linear-gradient(0deg, rgba(43,76,126,0.08) 0px, rgba(43,76,126,0.08) 1px, transparent 1px, transparent 32px); color: #2A2620; font-family: 'Atkinson Hyperlegible', system-ui, sans-serif">
  <div aria-hidden="true" style="position: absolute; left: 88px; top: 0; bottom: 0; width: 2px; background: rgba(178,58,38,0.35)"></div>
  <header style="position: absolute; left: 120px; top: 28px; display: flex; align-items: baseline; gap: 24px">
    <h1 style="margin: 0; font-family: Caveat, cursive; font-weight: 700; font-size: 80px; line-height: 1">Ghost Rovers</h1>
    <p style="margin: 0; font-family: Caveat, cursive; font-size: 28px; color: #2B4C7E">my log of the machines still on the Moon</p>
  </header>
  <figure style="margin: 0; position: absolute; left: 120px; top: 128px; width: 600px; height: 600px; box-sizing: border-box; padding: 30px; background: #141310; transform: rotate(-1.5deg); box-shadow: 0 2px 4px rgba(42,38,32,0.25), 0 18px 36px rgba(42,38,32,0.2)">
    <div aria-hidden="true" style="position: absolute; left: -30px; top: 22px; width: 130px; height: 34px; background: rgba(233,214,160,0.8); transform: rotate(-35deg)"></div>
    <div aria-hidden="true" style="position: absolute; right: -30px; top: 22px; width: 130px; height: 34px; background: rgba(233,214,160,0.8); transform: rotate(35deg)"></div>
    <div style="position: relative; width: 540px; height: 540px">
      <img src="../assets/moon_nearside.webp" alt="The near side of the Moon, from NASA's Lunar Reconnaissance Orbiter map" style="width: 540px; height: 540px; display: block">
      <button aria-label="Apollo 12 and Surveyor 3 site, 2 ghosts, selected" style="position: absolute; left: 139px; top: 260px; width: 48px; height: 48px; border: 3px solid #E0573B; border-radius: 48% 54% 46% 52%; background: rgba(224,87,59,0.2); color: #FFFFFF; font: 700 24px Caveat, cursive; cursor: pointer; padding: 0">2</button>
      <button aria-label="Apollo 11 site, 2 ghosts" style="position: absolute; left: 355px; top: 245px; width: 44px; height: 44px; border: 2.5px solid #FFFFFF; border-radius: 52% 46% 54% 48%; background: transparent; color: #FFFFFF; font: 700 22px Caveat, cursive; cursor: pointer; padding: 0">2</button>
      <button aria-label="Apollo 15 site, 1 ghost" style="position: absolute; left: 263px; top: 129px; width: 44px; height: 44px; border: 2.5px solid #FFFFFF; border-radius: 46% 52% 50% 54%; background: transparent; color: #FFFFFF; font: 700 22px Caveat, cursive; cursor: pointer; padding: 0">1</button>
      <button aria-label="Apollo 17 site, 1 ghost" style="position: absolute; left: 378px; top: 155px; width: 44px; height: 44px; border: 2.5px solid #FFFFFF; border-radius: 54% 48% 52% 46%; background: transparent; color: #FFFFFF; font: 700 22px Caveat, cursive; cursor: pointer; padding: 0">1</button>
    </div>
  </figure>
  <svg aria-hidden="true" width="1280" height="800" viewBox="0 0 1280 800" style="position: absolute; left: 0; top: 0; pointer-events: none">
    <path d="M806 214 C 720 228, 620 300, 553 408" fill="none" stroke="#B23A26" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"></path>
    <path d="M553 408 L 553 390 M553 408 L 570 400" fill="none" stroke="#B23A26" stroke-width="3" stroke-linecap="round"></path>
    <path d="M262 560 C 270 530, 292 500, 308 472" fill="none" stroke="#B23A26" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9"></path>
    <path d="M308 472 L 294 482 M308 472 L 311 489" fill="none" stroke="#B23A26" stroke-width="3" stroke-linecap="round"></path>
  </svg>
  <figure style="margin: 0; position: absolute; left: 806px; top: 104px; width: 224px; box-sizing: border-box; padding: 12px 12px 8px; background: #FFFFFF; transform: rotate(4deg); box-shadow: 0 2px 4px rgba(42,38,32,0.2), 0 10px 20px rgba(42,38,32,0.15)">
    <div aria-hidden="true" style="position: absolute; left: 62px; top: -12px; width: 100px; height: 26px; background: rgba(233,214,160,0.85); transform: rotate(-4deg)"></div>
    <img src="../assets/eagle_800.jpg" alt="The Apollo 11 lunar module Eagle in lunar orbit, July 1969" style="width: 200px; height: 170px; object-fit: cover; object-position: 50% 55%; display: block">
    <figcaption style="font-family: Caveat, cursive; font-size: 22px; padding-top: 4px">Eagle, July 1969. Its legs are still down there!</figcaption>
  </figure>
  <figure style="margin: 0; position: absolute; left: 40px; top: 560px; width: 250px; box-sizing: border-box; padding: 12px 12px 8px; background: #FFFFFF; transform: rotate(-5deg); box-shadow: 0 2px 4px rgba(42,38,32,0.2), 0 10px 20px rgba(42,38,32,0.15)">
    <div aria-hidden="true" style="position: absolute; right: 30px; top: -12px; width: 90px; height: 26px; background: rgba(233,214,160,0.85); transform: rotate(6deg)"></div>
    <img src="../assets/surveyor3_800.jpg" alt="Surveyor 3 on the Moon's surface, photographed by the Apollo 12 crew" style="width: 226px; height: 130px; object-fit: cover; object-position: 50% 58%; display: block">
    <figcaption style="font-family: Caveat, cursive; font-size: 22px; padding-top: 4px">Surveyor 3 got visitors!</figcaption>
  </figure>
  <article style="position: absolute; left: 820px; top: 340px; width: 400px; box-sizing: border-box; background-color: #FBF8F0; background-image: repeating-linear-gradient(0deg, rgba(43,76,126,0.12) 0px, rgba(43,76,126,0.12) 1px, transparent 1px, transparent 28px); padding: 24px 28px 20px; display: flex; flex-direction: column; gap: 8px; transform: rotate(0.6deg); box-shadow: 0 2px 4px rgba(42,38,32,0.18), 0 12px 28px rgba(42,38,32,0.14)">
    <p style="margin: 0; font-family: Caveat, cursive; font-size: 24px; color: #B23A26">Ghost #3 · landed April 1967</p>
    <h2 style="margin: 0; font-family: Caveat, cursive; font-weight: 700; font-size: 48px; line-height: 1">Surveyor 3</h2>
    <p style="margin: 0; font-size: 17px; line-height: 1.6">"I landed here alone in 1967. Two years later, two astronauts walked over to visit. They took my camera home so scientists could see what the Moon did to me."</p>
    <p style="margin: 0; font-size: 16px"><span style="font-family: Caveat, cursive; font-size: 22px; color: #2B4C7E">Status:</span> resting · <a href="https://nssdc.gsfc.nasa.gov/">check NASA's record</a></p>
  </article>
  <nav aria-label="All six ghosts" style="position: absolute; left: 800px; top: 652px; width: 450px; display: flex; gap: 6px; flex-wrap: wrap">
    <button style="min-height: 44px; padding: 0 10px; border: 1.5px solid rgba(42,38,32,0.5); border-radius: 12px 16px 10px 14px; background: transparent; color: #2A2620; font: 400 14px 'Atkinson Hyperlegible', sans-serif">Laser Mirror</button>
    <button style="min-height: 44px; padding: 0 10px; border: 1.5px solid rgba(42,38,32,0.5); border-radius: 16px 10px 14px 12px; background: transparent; color: #2A2620; font: 400 14px 'Atkinson Hyperlegible', sans-serif">Eagle's Launch Pad</button>
    <button style="min-height: 44px; padding: 0 10px; border: 2px solid #B23A26; border-radius: 10px 14px 12px 16px; background: rgba(178,58,38,0.1); color: #2A2620; font: 700 14px 'Atkinson Hyperlegible', sans-serif">Surveyor 3</button>
    <button style="min-height: 44px; padding: 0 10px; border: 1.5px solid rgba(42,38,32,0.5); border-radius: 14px 12px 16px 10px; background: transparent; color: #2A2620; font: 400 14px 'Atkinson Hyperlegible', sans-serif">Moonquake Station</button>
    <button style="min-height: 44px; padding: 0 10px; border: 1.5px solid rgba(42,38,32,0.5); border-radius: 12px 16px 10px 14px; background: transparent; color: #2A2620; font: 400 14px 'Atkinson Hyperlegible', sans-serif">Apollo 15 Rover</button>
    <button style="min-height: 44px; padding: 0 10px; border: 1.5px solid rgba(42,38,32,0.5); border-radius: 16px 10px 14px 12px; background: transparent; color: #2A2620; font: 400 14px 'Atkinson Hyperlegible', sans-serif">Apollo 17 Rover</button>
  </nav>
</div>


</body>
</html>
